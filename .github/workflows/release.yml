name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Kodu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Java (JDK 21) Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle Wrapper Oluştur
        run: gradle wrapper

      - name: Gradle'a Çalıştırma İzni Ver
        run: chmod +x gradlew

      - name: Debug APK Derle
        run: ./gradlew assembleDebug -Djava.awt.headless=true --stacktrace

      - name: GitHub Release'e Yükle
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
