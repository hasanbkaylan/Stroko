name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Sadece v ile başlayan etiketlerde çalışır (örn: v1.0, v1.1)
  workflow_dispatch: # Manuel olarak tetikleyebilmeniz için

jobs:
  build:
    runs-on: ubuntu-latest
    
    # İzinler release upload etmek için gereklidir
    permissions:
      contents: write

    steps:
      - name: Kodu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle Wrapper'ı Yeniden Oluştur ve Doğrula
        run: gradle wrapper

      - name: Gradle'a Çalıştırma İzni Ver
        run: chmod +x gradlew

      - name: Debug APK Derle
        run: ./gradlew assembleDebug

      - name: GitHub Release'e Yükle
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
